{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block head_title %}{% endblock head_title %} · Name the Frame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{ --gold:#c9a227; --gold-hi:#e0b84a; --bg:#16140f; --panel:#1b1813; --border:#2a261d; --ink:#e8e3d6; --muted:#9a8a5c; }
    *{ box-sizing:border-box; }
    body{ margin:0; min-height:100vh; background:
        radial-gradient(1200px 500px at 50% -10%, #241f15 0%, transparent 60%), var(--bg);
        color:var(--ink); font-family:'Space Mono',monospace; display:flex; align-items:center; justify-content:center; padding:24px; }
    .auth-wrap{ width:100%; max-width:430px; }
    .brand{ text-align:center; margin-bottom:22px; }
    .brand a{ text-decoration:none; }
    .brand .t{ font-family:'Cinzel',serif; font-size:26px; letter-spacing:1px; color:var(--gold-hi); }
    .brand .s{ display:block; margin-top:6px; font-size:10px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; }
    .card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:30px 28px;
        box-shadow:0 20px 60px #000a; }
    h1,h2{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:24px; margin:0 0 6px; color:var(--ink); }
    p{ color:var(--muted); font-size:12px; line-height:1.6; }
    a{ color:var(--gold); }
    a:hover{ color:var(--gold-hi); }
    form{ margin-top:18px; }
    label{ display:block; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin:14px 0 6px; }
    input[type=text],input[type=email],input[type=password],input:not([type]){
        width:100%; padding:12px 14px; background:#100f0c; border:1px solid var(--border); border-radius:8px;
        color:var(--ink); font-family:'Space Mono',monospace; font-size:14px; }
    input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px #c9a22733; }
    button,.button,input[type=submit]{
        display:inline-block; width:100%; margin-top:20px; padding:13px 18px; border:none; border-radius:8px;
        background:var(--gold); color:#100f0c; font-family:'Space Mono',monospace; font-weight:700;
        font-size:12px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; text-align:center; text-decoration:none; }
    button:hover,.button:hover,input[type=submit]:hover{ background:var(--gold-hi); }
    .secondary,a.button.secondary{ background:transparent; color:var(--gold); border:1px solid var(--border); }
    ul{ list-style:none; padding:0; margin:8px 0; }
    .errorlist{ color:#e57373; font-size:11px; margin:6px 0; }
    .helptext{ display:block; color:var(--muted); font-size:10px; margin-top:4px; line-height:1.5; }
    input[type=checkbox]{ width:auto; margin-right:8px; }
    .foot{ text-align:center; margin-top:18px; font-size:12px; }
    .back{ display:block; text-align:center; margin-top:16px; font-size:11px; letter-spacing:1px; color:var(--muted); }
    /* "lub" separator */
    .social-sep{ display:flex; align-items:center; gap:12px; margin:20px 0 14px; color:var(--muted); font-size:11px; }
    .social-sep::before,.social-sep::after{ content:""; flex:1; height:1px; background:var(--border); }
    /* modern Google button (white, brand-correct) */
    .social-btn{ display:flex; align-items:center; justify-content:center; gap:10px;
      width:100%; padding:11px 16px; background:#fff; color:#1f1f1f; border:1px solid #dadce0;
      border-radius:8px; font-family:'Space Mono',monospace; font-size:13px; font-weight:700;
      text-decoration:none; transition:box-shadow .15s,background .15s; }
    .social-btn:hover{ background:#f7f8f8; box-shadow:0 1px 6px #0006; color:#1f1f1f; }
    .social-btn + .social-btn{ margin-top:10px; }
    .social-ic{ flex:none; }
  </style>
  {% block extra_head %}{% endblock extra_head %}
</head>
<body>
  <div class="auth-wrap">
    <div class="brand">
      <a href="/"><span class="t">🎞️ Name the Frame</span></a>
    </div>
    <div class="card">
      {% block content %}{% endblock content %}
    </div>
    <a class="back" href="/">← wróć do gry</a>
  </div>
  {% block extra_body %}{% endblock extra_body %}
</body>
</html>
