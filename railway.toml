[build]
builder = "dockerfile"

[deploy]
# Build (Dockerfile) runs collectstatic only — no DB. migrate runs at
# container start, where the private network to Postgres is available.
startCommand = "python manage.py migrate --noinput && python manage.py ensure_superuser && gunicorn nametheframe.wsgi --workers 2 --bind 0.0.0.0:$PORT"
restartPolicyType = "on_failure"

[[deploy.envVars]]
name = "DJANGO_SETTINGS_MODULE"
value = "nametheframe.settings"
