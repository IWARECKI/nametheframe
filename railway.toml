[build]
builder = "nixpacks"

[deploy]
# collectstatic is required (WhiteNoise CompressedManifestStaticFilesStorage),
# then migrate, then serve. Runs on every deploy.
startCommand = "python manage.py collectstatic --noinput && python manage.py migrate --noinput && gunicorn nametheframe.wsgi --workers 2 --bind 0.0.0.0:$PORT"
restartPolicyType = "on_failure"

[[deploy.envVars]]
name = "DJANGO_SETTINGS_MODULE"
value = "nametheframe.settings"
