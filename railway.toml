[build]
builder = "dockerfile"

[deploy]
# No startCommand: the container runs the Dockerfile CMD (entrypoint.sh),
# which does migrate → ensure_superuser → exec gunicorn. Using the image's
# own entrypoint avoids any ambiguity in how the platform wraps a shell
# startCommand, and `exec gunicorn` keeps the process in the foreground.
restartPolicyType = "on_failure"

[[deploy.envVars]]
name = "DJANGO_SETTINGS_MODULE"
value = "nametheframe.settings"
