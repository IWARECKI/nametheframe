[build]
builder = "nixpacks"

[deploy]
# migrate runs AFTER build (preDeploy has DB network access; build does not).
# collectstatic runs at build time (see nixpacks.toml) — it needs no DB.
preDeployCommand = "python manage.py migrate --noinput"
startCommand = "gunicorn nametheframe.wsgi --workers 2 --bind 0.0.0.0:$PORT"
restartPolicyType = "on_failure"

[[deploy.envVars]]
name = "DJANGO_SETTINGS_MODULE"
value = "nametheframe.settings"
